<!-- Interactive Sparkles Effect (Vanilla JS) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.querySelector('button');
      
      button.addEventListener('mouseenter', () => {
        // Soft haptic feedback simulation
        if (window.navigator.vibrate) {
          window.navigator.vibrate(5);
        }
      });

      // Simple animation for the house icon to pulse gently
      const houseIcon = document.querySelector('.material-symbols-outlined');
      setInterval(() => {
        houseIcon.style.transform = 'scale(1.05)';
        setTimeout(() => {
          houseIcon.style.transform = 'scale(1)';
        }, 1000);
      }, 3000);
    });
  </script>
