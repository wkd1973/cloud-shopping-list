<style>
        body { font-family: 'DM Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
        
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            background-color: #ffffff;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-bg min-h-screen flex items-center justify-center p-gutter">
<!-- Login Container -->
<main class="w-full max-w-sm">
<div class="login-card rounded-2xl p-stack-lg flex flex-col items-center">
<!-- Branding Header -->
<div class="mb-stack-lg text-center">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-stack-md mx-auto shadow-sm">
<span class="text-4xl">🛒</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-2 tracking-tight">Zakupy</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-4">Twoja inteligentna lista zakupów</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-md" id="loginForm" onsubmit="handleLogin(event)">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="email" placeholder="twoj@email.pl" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary-container hover:bg-emerald-600 text-on-primary-container font-body-lg text-body-lg py-3.5 rounded-xl shadow-sm transition-all active:scale-95 flex items-center justify-center gap-2 group" id="submitBtn" type="submit">
<span>Wyślij link logowania</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Social/Secondary Actions -->
<div class="w-full mt-stack-lg pt-stack-lg border-t border-surface-container flex flex-col gap-3">
<button class="w-full py-2.5 px-4 bg-surface-container-low hover:bg-surface-container text-secondary font-body-md text-body-md rounded-xl transition-colors flex items-center justify-center gap-2">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAX262GlfdB3_-VX5Ns-BJSJxKEHPe1-ksINPWOivcdzIp7O6dzeCxt7PrJS9Lyn_Da9lw-SsPXVwCY26n7WsV3vniQPqFaI3I7RFFU0q8xm_cm9XGLr1X5nowfAlPvJbFzvMg218TIIoU5AHtIKczoD_FUd__Q1bgqlSnH2GSpo8hA1k5jw91HF4upmp9Mq3xo_tZCO93Nci5n5dGxLvXVt-X7bDw8mPGijY6Oa1OJ5SS0FpyFBnvJfifSJrxBUcrhzCSmuIeMJjEy"/>
                    Kontynuuj przez Google
                </button>
</div>
<p class="mt-stack-lg font-label-sm text-label-sm text-on-surface-variant text-center">
                Nie masz jeszcze konta? <a class="text-primary font-bold hover:underline" href="#">Zarejestruj się</a>
</p>
</div>
<!-- App Quality visual -->
<div class="mt-stack-lg grid grid-cols-3 gap-2 px-4 opacity-40">
<div class="h-1 bg-outline-variant rounded-full"></div>
<div class="h-1 bg-outline-variant rounded-full"></div>
<div class="h-1 bg-outline-variant rounded-full"></div>
</div>
</main>
<!-- Visual Background Element (Atmospheric) -->
<div class="fixed -bottom-20 -right-20 w-80 h-80 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-20 -left-20 w-64 h-64 bg-category-produce/5 rounded-full blur-3xl -z-10"></div>
<script>
        function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const originalContent = submitBtn.innerHTML;

            // Simple visual feedback
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-on-primary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Wysyłanie...</span>
            `;

            // Mocking success
            setTimeout(() => {
                submitBtn.classList.remove('bg-primary-container');
                submitBtn.classList.add('bg-category-produce');
                submitBtn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Wysłano link!</span>
                `;
                
                // Trigger shake if empty (for demo logic)
                if(!emailInput.value) {
                    emailInput.parentElement.classList.add('animate-shake', 'border-error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalContent;
                    setTimeout(() => emailInput.parentElement.classList.remove('animate-shake'), 400);
                }
            }, 1200);
        }
    </script>
</body></html>
